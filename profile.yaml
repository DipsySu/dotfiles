# =================================================================
# Dotfiles Profile Configuration
# 复制此文件并根据你的需求修改配置
# =================================================================

# Git 配置
git:
  name: "Dipsy"                              # 你的 Git 用户名
  email: "you@example.com"      # 你的 Git 邮箱

# 开发工具版本配置
versions:
  go: "latest"          # Go 版本 (latest, 1.21, 1.20 等)
  java: "temurin-21"    # Java 版本 (temurin-21, temurin-17, temurin-11 等)
  node: "lts"           # Node.js 版本 (lts, latest, 18, 20 等)
  python: "3.11"        # Python 版本 (3.11, 3.10, 3.9 等)
  flutter: "3.35.3"     # Flutter 版本

# AWS 配置
aws:
  codeartifact_domain: ""           # 只在 ~/.config/chezmoi/local.toml 里填
  profiles: []                      # 见 TIPS.md「私有变量 local.toml」

# 家居自动化配置 (如果你使用 Tailscale 远程控制)
home:
  tailscale_path: ""                    # 留空自动检测 WSL/macOS/Linux Tailscale 路径
  ssh_host: "home-pc"               # SSH 主机别名
  pc_ip: "192.168.1.100"          # 家用电脑 IP 地址
  nas_ssh: ""            # user@host，留空则不生成 sshnas 别名
  nas_nfs: ""            # host:/export，留空则不生成 mountnas 别名
wsl:
  win_home: ""           # WSL 填 /mnt/c/Users/<name>，macOS 留空

# Shell 功能开关
shell:
  enable_starship: true    # 启用 Starship 提示符 (推荐)
  enable_zoxide: true      # 启用 Zoxide 智能 cd (推荐)
  enable_eza: true         # 启用 Eza 更好的 ls (推荐)

